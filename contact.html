<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | ISH EDITION</title>
<meta name="description" content="Contact ISH EDITION about video editing and VFX projects.">
<meta name="theme-color" content="#070707">
<meta property="og:title" content="Contact | ISH EDITION">
<meta property="og:description" content="Contact ISH EDITION about video editing and VFX projects.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070707'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ff1f1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">

<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow reveal">06 / Contact</p>
    <h1 class="h-display page-title reveal" style="--d:80ms">Let's <span class="red">talk</span></h1>
    <p class="lede reveal" style="--d:160ms">For video editing and VFX inquiries, share a project brief using the contact options below.</p>
  </div>
</section>

<section class="section tight">
  <div class="wrap contact-grid">
    <div class="reveal">
      <p class="eyebrow">Email</p>
      <div class="mail-box">
        <a data-email href="#">Email not configured yet</a>
        <button type="button" class="copy" id="copy-email">Copy</button>
      </div>
      <p class="eyebrow" style="margin-top:34px">Elsewhere</p>
      <div class="socials" id="socials" aria-label="Social links"></div>
    </div>

    <form class="form reveal" id="contact-form" style="--d:100ms" novalidate>
      <h2 class="h-display">Send a message</h2>
      <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" type="text" autocomplete="name" maxlength="100" required></div>
      <div class="field"><label for="f-email">Your email</label><input id="f-email" name="email" type="email" autocomplete="email" maxlength="150" required></div>
      <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" maxlength="5000" required></textarea></div>
      <div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn btn-primary" type="submit">Send message <span class="arr">&rarr;</span></button>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
      <p class="fineprint">Your message is sent to the configured contact email.</p>
    </form>
  </div>
</section>

</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/contact.js"></script>
<script>
/* build the social buttons from js/config.js (only the ones that are filled in) */
(function(){
  var box=document.getElementById('socials'); if(!box) return;
  var soc=(window.SITE&&window.SITE.socials)||{}, n=0;
  Object.keys(soc).forEach(function(k){
    if(!/^https?:\/\//i.test(soc[k]||'')) return;
    var a=document.createElement('a'); a.href=soc[k]; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=k;
    box.appendChild(a); n++;
  });
  if(!n){ var p=document.createElement('p'); p.className='fineprint'; p.textContent='Add your social links in js/config.js and they will show up here.'; box.appendChild(p); }
})();
</script>
</body>
</html>
